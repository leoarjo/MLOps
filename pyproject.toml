[project]
name = "churn"
version = "0.1.0"
description = "Previsão de churn — projeto-fio-condutor do curso de MLOps."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pandera>=0.33.0",
    "mlflow>=3.18.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "dvc>=3.67.1",
    "pytest>=8.0",
]
serve = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "streamlit>=1.40",
    "uvicorn[standard]>=0.30",
]

[tool.uv]
# `uv sync` local instala tudo (treino + testes + serving). As imagens Docker
# escolhem o grupo explicitamente: treino usa --no-default-groups, serving
# usa --no-default-groups --group serve.
default-groups = ["dev", "serve"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churn"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
